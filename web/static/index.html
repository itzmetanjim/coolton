<div id="app" class="app">
  <button id="drawerToggle" class="drawer-toggle" aria-label="Show sessions">
    <svg class="icon" viewBox="0 0 24 24"><path d="M4 7h16"/><path d="M4 12h16"/><path d="M4 17h16"/></svg>
  </button>

  <aside id="sidebar" class="sidebar">
    <div class="sidebar-head">
      <img class="brand-mark" src="/static/coolton.png" alt="">
      <span class="brand-name">coolton web (beta)</span>
    </div>

    <button id="newConversationBtn" class="new-session">
      <svg class="icon" viewBox="0 0 24 24"><use href="#i-plus"/></svg>
      <span>New session</span>
    </button>

    <nav id="conversationList" class="session-list" aria-label="Sessions"></nav>
    <div id="userFooter" class="user-footer"></div>
  </aside>
  <div id="sidebarResizer" class="sidebar-resizer" role="separator" aria-orientation="vertical" aria-label="Resize sidebar"></div>

  <div id="backdrop" class="backdrop"></div>

  <main class="main">
    <header id="statusBar" class="status-bar">
      <button type="button" id="statusTitle" class="status-title" title="Rename this session">Select a session</button>
      <!-- Mobile-only fallback: on desktop the composer's own status-state
           (below) shows this instead, since there's room there without
           narrowing the message box. -->
      <span id="statusStateHeader" class="status-state status-state--header">
        <span class="state-dot"></span><span class="status-state-text">Idle</span>
      </span>
    </header>

    <div id="transcript" class="transcript">
      <div id="emptyState" class="empty-state">
        <img src="/static/coolton.png" alt="">
        <p>hi! i'm an AI agent. i open PRs on GitHub, dig into stuff, run code in a sandbox, search Slack, and more. ask below.</p>
      </div>
    </div>

    <form id="composer" class="composer">
      <div id="attachmentTray" class="attachment-tray" hidden></div>
      <div id="mdToolbar" class="md-toolbar" role="toolbar" aria-label="Formatting">
        <button type="button" class="md-tool" data-md="bold" title="Bold (Ctrl+B)" aria-label="Bold"><svg class="icon" viewBox="0 0 24 24"><use href="#i-bold"/></svg></button>
        <button type="button" class="md-tool" data-md="italic" title="Italic (Ctrl+I)" aria-label="Italic"><svg class="icon" viewBox="0 0 24 24"><use href="#i-italic"/></svg></button>
        <button type="button" class="md-tool" data-md="strike" title="Strikethrough" aria-label="Strikethrough"><svg class="icon" viewBox="0 0 24 24"><use href="#i-strike"/></svg></button>
        <span class="md-tool-sep" aria-hidden="true"></span>
        <button type="button" class="md-tool" data-md="code" title="Inline code" aria-label="Inline code"><svg class="icon" viewBox="0 0 24 24"><use href="#i-code"/></svg></button>
        <button type="button" class="md-tool" data-md="codeblock" title="Code block" aria-label="Code block"><svg class="icon" viewBox="0 0 24 24"><use href="#i-code"/></svg></button>
        <button type="button" class="md-tool" data-md="link" title="Link" aria-label="Link"><svg class="icon" viewBox="0 0 24 24"><use href="#i-link"/></svg></button>
        <span class="md-tool-sep" aria-hidden="true"></span>
        <button type="button" class="md-tool" data-md="ul" title="Bulleted list" aria-label="Bulleted list"><svg class="icon" viewBox="0 0 24 24"><use href="#i-list"/></svg></button>
        <button type="button" class="md-tool" data-md="ol" title="Numbered list" aria-label="Numbered list"><svg class="icon" viewBox="0 0 24 24"><use href="#i-list-ol"/></svg></button>
        <button type="button" class="md-tool" data-md="quote" title="Quote" aria-label="Quote"><svg class="icon" viewBox="0 0 24 24"><use href="#i-quote"/></svg></button>
      </div>
      <div class="composer-row">
        <textarea id="composerInput" class="composer-input" placeholder="Message coolton" rows="1"></textarea>
        <div class="composer-actions">
          <button type="button" id="attachBtn" class="icon-btn" title="Attach a file" aria-label="Attach a file">
            <svg class="icon" viewBox="0 0 24 24"><use href="#i-clip"/></svg>
          </button>
          <input type="file" id="fileInput" multiple hidden>
          <button type="button" id="stopBtn" class="icon-btn icon-btn-stop" title="Stop coolton" aria-label="Stop coolton" hidden>
            <svg class="icon" viewBox="0 0 24 24"><use href="#i-stop"/></svg>
          </button>
          <button type="submit" id="sendBtn" class="icon-btn icon-btn-send" title="Send" aria-label="Send">
            <svg class="icon" viewBox="0 0 24 24"><use href="#i-send"/></svg>
          </button>
        </div>
      </div>
      <div class="composer-foot">
        <p class="composer-hint">Enter to send &middot; Shift+Enter for a new line &middot; send while it&rsquo;s working to steer it</p>
        <span id="statusStateComposer" class="status-state status-state--composer">
          <span class="state-dot"></span><span class="status-state-text">Idle</span>
        </span>
      </div>
    </form>
  </main>

  <div id="settingsModal" class="settings-modal-overlay" hidden>
    <div class="settings-modal" role="dialog" aria-modal="true" aria-label="Settings">
      <button type="button" id="settingsClose" class="settings-close" aria-label="Close settings">
        <svg class="icon" viewBox="0 0 24 24"><use href="#i-close"/></svg>
      </button>
      <nav id="settingsNav" class="settings-nav" aria-label="Settings sections"></nav>
      <div id="settingsBody" class="settings-body"></div>
    </div>
  </div>
</div>

<template id="tpl-user-message">
  <div class="row row-user">
    <div class="row-gutter"><span class="row-time"></span></div>
    <div class="row-main">
      <div class="row-actor">
        <img class="actor-avatar" alt="">
        <span class="actor-name">You</span>
      </div>
      <div class="row-text"></div>
      <div class="row-attachments"></div>
      <div class="row-reactions"></div>
    </div>
  </div>
</template>

<template id="tpl-turn">
  <div class="row row-agent turn working">
    <div class="row-gutter"><span class="row-time"></span></div>
    <div class="row-main">
      <div class="row-actor">
        <img class="actor-avatar" src="/static/coolton.png" alt="">
        <span class="actor-name">coolton</span>
      </div>
      <div class="spine-group" hidden>
        <button type="button" class="spine-head">
          <span class="caret" aria-hidden="true"></span><span class="spine-count"></span>
        </button>
        <div class="spine"></div>
      </div>
      <div class="turn-content"></div>
    </div>
  </div>
</template>

<template id="tpl-spine-node">
  <div class="spine-node">
    <button type="button" class="spine-line">
      <span class="caret" aria-hidden="true"></span>
      <span class="spine-marker"></span>
      <span class="spine-title"></span>
      <span class="spine-time"></span>
    </button>
    <div class="spine-detail" hidden>
      <div class="spine-args"></div>
      <div class="spine-result"></div>
    </div>
  </div>
</template>

<template id="tpl-policy-prompt">
  <div class="policy-prompt">
    <div class="policy-prompt-body">
      <p>before using Coolton, you need to opt in to the <a href="" target="_blank" rel="noopener noreferrer">Coolton policy</a>. you can join the <code>#coolton</code> channel or opt in without joining it.</p>
    </div>
    <div class="policy-prompt-actions">
      <button type="button" class="bk-button primary policy-join">opt in and join channel</button>
      <button type="button" class="bk-button policy-nojoin">opt in without joining channel</button>
    </div>
  </div>
</template>
